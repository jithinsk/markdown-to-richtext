version: 2

updates:
  # ---------------------------------------------------------------------------
  # The library itself
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    # This package is published, so only widen the declared ranges when a new
    # version genuinely falls outside them. Keeps consumers from being forced
    # onto a newer floor for no reason.
    versioning-strategy: increase-if-necessary
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # TypeScript 7 crashes the build: tsup 8 bundles rollup-plugin-dts, which
      # is pinned internally to typescript 5.7, and .d.ts generation dies with
      # "Cannot read properties of undefined (reading 'useCaseSensitiveFileNames')".
      # Nothing to fix on our side — this is waiting on tsup upstream.
      # Remove this entry once tsup supports TypeScript 7. Minor and patch
      # updates within 5.x still come through.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

    groups:
      # remark/unified releases move in lockstep; one PR per week is enough.
      unified-ecosystem:
        patterns:
          - unified
          - remark*
          - mdast*
          - unist*
          - "@types/mdast"
        update-types:
          - minor
          - patch
      # @vitest/coverage-v8 declares an exact peer on vitest, so a split major
      # bump can never install. No update-types filter here on purpose: majors
      # must travel together too.
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
      dev-dependencies:
        dependency-type: development
        exclude-patterns:
          - vitest
          - "@vitest/*"
        update-types:
          - minor
          - patch

  # ---------------------------------------------------------------------------
  # GitHub Actions used by the workflows below
  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"
