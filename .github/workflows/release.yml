name: Release

# Cut a release with:
#   npm version patch    (or minor / major — writes package.json + creates the tag)
#   git push --follow-tags
on:
  push:
    tags:
      - "v*"

# Never cancel a half-finished publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create the GitHub Release
  id-token: write # mint the OIDC token npm trades for publish credentials

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so generated release notes can diff against prior tags

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) needs npm >= 11.5.1; the npm bundled with
      # setup-node's Node 22 is older than that.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - run: npm ci

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}."
            echo "::error::Use 'npm version <patch|minor|major>' so both stay in step."
            exit 1
          fi
          echo "Releasing v${PKG_VERSION}"

      - name: Verify this version is not already published
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          PUBLISHED="$(npm view "md-to-rich@${PKG_VERSION}" version 2>/dev/null || true)"
          if [ -n "$PUBLISHED" ]; then
            echo "::error::md-to-rich@${PKG_VERSION} is already on npm. Versions are immutable."
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Provenance is attested from the OIDC token, tying the tarball to this
      # workflow, this commit, and this repo. No npm token is stored anywhere.
      - name: Publish
        run: npm publish --provenance

      # Prefer the hand-written CHANGELOG section for this version; fall back
      # to notes generated from commits when that section is absent.
      - name: Extract release notes
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md || true

          if grep -q '[^[:space:]]' release-notes.md; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No CHANGELOG.md section for ${VERSION}; generating notes from commits."
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

      # Tells the docs site to move its playground onto this release. Requires
      # SITE_DISPATCH_TOKEN — a token with contents:write on
      # jithinsk/md-to-rich.github.io, since GITHUB_TOKEN cannot reach another
      # repository. Without the secret this step is skipped and the site's
      # scheduled sync picks the release up within six hours instead.
      - name: Notify docs site
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        if: env.GH_TOKEN != ''
        run: |
          gh api repos/jithinsk/md-to-rich.github.io/dispatches \
            -f event_type=md-to-rich-released \
            -f client_payload[version]="${GITHUB_REF_NAME#v}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAS_NOTES: ${{ steps.notes.outputs.has_notes }}
        run: |
          if [ "$HAS_NOTES" = "true" ]; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              --verify-tag
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
